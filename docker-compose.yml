# Docker Compose for a VPS. Publishes the container's :8000 on host port 9012.
#
#   cp .env.example .env      # set YT_API_TOKEN (and YT_PUBLIC_BASE for the domain)
#   docker compose up -d --build
#
# JSON:  http://<vps>:9012/api/...
# XML:   http://<vps>:9012/feeds/<slug>.xml
#
# For a real domain set the public prefix, e.g.:
#   YT_PUBLIC_BASE=https://feeds.example.com docker compose up -d
# it is what RSS self-links and feed_url point to.

services:
  yt-feeds:
    build: .
    image: yt-feeds-api:latest
    container_name: yt-feeds-api
    restart: unless-stopped
    ports:
      - "9012:8000"
    env_file:
      - .env
    environment:
      # In-container values win over .env, which is shared with local development.
      YT_API_HOST: 0.0.0.0
      YT_API_PORT: "8000"
      YT_FEEDS_BASE: /data
      YT_SERVE_FEEDS: "1"
      YT_REFRESH_INTERVAL: "1800"
      YT_FEEDS_PUBLIC_BASE: ${YT_PUBLIC_BASE:-http://localhost:9012/feeds}
    volumes:
      - yt-data:/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % (os.environ.get('YT_API_PORT') or os.environ.get('PORT') or '8000'), timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yt-data:
